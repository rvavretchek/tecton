packages:
  - 'packages/*'

# Fail installs on a Node version outside "engines" (>=24.19 <25).
engineStrict: true
linkWorkspacePackages: true

# Dependency build scripts stay disabled unless explicitly allowed here.
# None of these is needed: playwright-utils' postinstall runs `git submodule update`
# in the consumer repo, cpu-features/ssh2 are optional native SSH accelerators, and
# protobufjs' postinstall is only a version check, and @scarf/scarf (pulled by
# @asyncapi/parser) only sends install telemetry.
allowBuilds:
  # Prisma 7 (Story 2.2a, approved by the Boss): prisma's preinstall checks the Node version;
  # @prisma/engines' postinstall downloads the schema engine used by migrations.
  prisma: true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@seontechnologies/playwright-utils': false
  cpu-features: false
  protobufjs: false
  ssh2: false
