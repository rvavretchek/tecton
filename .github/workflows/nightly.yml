name: Nightly

# Expensive or long-running checks that do not belong on every push (Test Design, execution strategy):
#   - burn-in: repeats the suites in shuffled order to surface flaky tests
#   - Playwright API/E2E: dormant until a runnable Tecton workspace exists (Epic 3/4);
#     enable by setting the repository variable PLAYWRIGHT_ENABLED=true.
on:
  schedule:
    - cron: '0 6 * * *' # 03:00 in Brasília
  workflow_dispatch:
    inputs:
      iterations:
        description: Burn-in iterations
        required: false
        default: '5'

permissions:
  contents: read

jobs:
  burn-in:
    name: burn-in
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Security: inputs passed through env: to prevent script injection
      ITERATIONS: ${{ inputs.iterations || '5' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Repeat suites in shuffled order
        run: |
          case "$ITERATIONS" in ''|*[!0-9]*) echo "iterations must be a number"; exit 1;; esac
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Burn-in iteration $i/$ITERATIONS"
            pnpm test -- --sequence.shuffle || exit 1
            pnpm test:containers -- --sequence.shuffle || exit 1
            pnpm test:persistence -- --sequence.shuffle || exit 1
            echo "::endgroup::"
          done
      - name: Generated workspace installs and builds
        run: pnpm test:generation
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-burn-in
          path: test-results/
          retention-days: 14

  playwright:
    name: playwright (${{ matrix.project }})
    if: vars.PLAYWRIGHT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [api, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        if: matrix.project == 'e2e'
        run: pnpm exec playwright install --with-deps chromium
      # Starting the Tecton workspace under test (tecton-admin dev) is added in Story 3.13.
      - run: pnpm exec playwright test --project="${{ matrix.project }}"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}
          path: test-results/
          retention-days: 14
