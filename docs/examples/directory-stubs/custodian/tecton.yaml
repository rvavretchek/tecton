# Tenant example references. Remove when @tecton/directory exports its manifests.
manifestVersion: "0.1"

domain: custodian
version: 0.0.0
description: "Key custodian of a tenant (interface only in the MVP)."

objectClass:
  name: Custodian
  containment:
    allowedParents: [Tenant]
